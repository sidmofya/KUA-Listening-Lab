<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AB/noCD – KŮA Listening Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,700;1,700&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --copper: #b87333;
            --copper-lt: #d4a574;
            --glass: rgba(24, 22, 20, 0.34);
            --glass-strong: rgba(22, 20, 18, 0.74);
            --line: rgba(255, 255, 255, 0.78);
            --line-soft: rgba(255, 255, 255, 0.18);
            --muted: rgba(255, 255, 255, 0.62);
            --nav-h: 40px;
            --gutter: 10px;
            --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --cond: 'Archivo Narrow', 'Arial Narrow', sans-serif;
            --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #fff;
            color: #fff;
            font-family: var(--ui);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer;
        }

        button:focus-visible, textarea:focus-visible, input:focus-visible {
            outline: 2px solid var(--copper-lt);
            outline-offset: 2px;
        }

        /* ---------- Top nav ---------- */

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 0 12px;
            background: #fff;
            color: #000;
            z-index: 30;
        }

        .wordmark {
            font-family: var(--cond);
            font-weight: 700;
            font-size: 19px;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .wordmark sup {
            font-size: 9px;
        }

        .collections {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .collections::-webkit-scrollbar {
            display: none;
        }

        .collections button {
            font-family: var(--cond);
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #000;
        }

        .collections button[aria-current="true"] {
            font-style: italic;
        }

        .collections sup {
            font-family: var(--mono);
            font-style: normal;
            font-size: 9px;
            font-weight: 500;
            margin-left: 2px;
            color: #777;
        }

        /* ---------- Stage & scene ---------- */

        .stage {
            position: fixed;
            top: var(--nav-h);
            left: var(--gutter);
            right: var(--gutter);
            bottom: var(--gutter);
            overflow: hidden;
            background: #8e8c88;
        }

        .scene {
            position: absolute;
            left: 0;
            top: 0;
            width: 1600px;
            height: 900px;
            transform-origin: 0 0;
            transition: transform 1.1s cubic-bezier(0.65, 0, 0.25, 1);
            will-change: transform;
        }

        .scene > img, .scene > svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 1600px;
            height: 900px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .scene > svg {
            pointer-events: none;
        }

        /* ---------- Glass panels ---------- */

        .panel {
            position: absolute;
            top: 24px;
            width: 288px;
            background: var(--glass);
            border: 1px solid var(--line);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            z-index: 6;
            transition: width 0.35s ease;
        }

        .panel-left {
            left: 24px;
        }

        .panel-right {
            right: 24px;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 16px 10px;
            font-size: 15px;
            font-weight: 500;
            text-transform: uppercase;
            text-align: left;
        }

        .chev {
            width: 12px;
            height: 12px;
            flex: none;
            transition: transform 0.3s ease;
        }

        [aria-expanded="true"] .chev {
            transform: rotate(180deg);
        }

        .panel-song {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 6px 16px 14px;
            min-width: 0;
        }

        .cover {
            width: 38px;
            height: 38px;
            flex: none;
            display: grid;
            place-items: center;
            font-family: var(--cond);
            font-size: 13px;
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        .song-meta {
            min-width: 0;
        }

        .song-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-sub {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .panel-foot {
            border-top: 1px solid var(--line-soft);
            padding: 12px 16px 14px;
        }

        .lyrics {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.86);
            white-space: pre-line;
            max-height: 4.8em;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(#000 55%, transparent);
            mask-image: linear-gradient(#000 55%, transparent);
        }

        .panel-left.expanded {
            width: 380px;
            background: var(--glass-strong);
        }

        .panel-left.expanded .lyrics {
            max-height: min(58vh, 520px);
            overflow-y: auto;
            -webkit-mask-image: none;
            mask-image: none;
            padding-right: 6px;
        }

        .picker-list {
            display: none;
            max-height: min(48vh, 420px);
            overflow-y: auto;
            border-top: 1px solid var(--line-soft);
        }

        .panel-right.open {
            background: var(--glass-strong);
        }

        .panel-right.open .picker-list {
            display: block;
        }

        .picker-list button {
            display: grid;
            grid-template-columns: 26px 1fr auto;
            gap: 8px;
            align-items: center;
            width: 100%;
            padding: 9px 16px;
            text-align: left;
            font-size: 13px;
        }

        .picker-list button:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .picker-list button.current {
            background: rgba(184, 115, 51, 0.32);
        }

        .picker-list .n {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        .picker-list .v {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--copper-lt);
            text-transform: uppercase;
        }

        .picker-foot {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .picker-foot .step {
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            opacity: 0.75;
        }

        .picker-foot .step:hover {
            opacity: 1;
        }

        .picker-foot .step:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .dots {
            display: flex;
            gap: 5px;
            margin-left: auto;
        }

        .dots i {
            width: 7px;
            height: 7px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .dots i.voted {
            background: #fff;
        }

        .dots i.current {
            border-color: var(--copper-lt);
            box-shadow: 0 0 0 2px rgba(184, 115, 51, 0.55);
        }

        /* ---------- Hint, crossfader, bars ---------- */

        .hint {
            position: absolute;
            left: 50%;
            bottom: 140px;
            transform: translateX(-50%);
            font-size: 13px;
            white-space: nowrap;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        .hint:empty {
            opacity: 0;
        }

        .xfader {
            position: absolute;
            left: 50%;
            bottom: 70px;
            transform: translateX(-50%);
            width: 220px;
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            z-index: 5;
            user-select: none;
        }

        .xfader-label {
            margin-bottom: 6px;
        }

        .xfader-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            touch-action: none;
            cursor: grab;
        }

        .xfader-track {
            position: relative;
            flex: 1;
            height: 3px;
            background: #fff;
        }

        .xfader-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #fff;
            transition: left 0.45s cubic-bezier(0.65, 0, 0.35, 1), border-color 0.3s ease, background 0.3s ease;
        }

        .xfader.live .xfader-knob {
            border-color: var(--copper-lt);
            background: rgba(184, 115, 51, 0.7);
        }

        .xfader.dragging .xfader-knob {
            transition: none;
        }

        .bars {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            z-index: 6;
        }

        .bar {
            position: relative;
            height: 46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--line);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            font-size: 15px;
            font-weight: 500;
            text-transform: uppercase;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        .bar:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .bar.active {
            background: rgba(184, 115, 51, 0.4);
            border-color: var(--copper-lt);
        }

        .bar .prog {
            position: absolute;
            left: -1px;
            right: -1px;
            top: -6px;
            height: 3px;
            background: rgba(255, 255, 255, 0.28);
        }

        .bar .prog i {
            display: block;
            height: 100%;
            width: 0;
            background: #fff;
        }

        .bar.active .prog i {
            background: var(--copper-lt);
        }

        .bar .time {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        .bar .state {
            position: absolute;
            left: 12px;
            top: 50%;
            width: 12px;
            height: 12px;
            transform: translateY(-50%);
        }

        .bar .sub {
            font-family: var(--mono);
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin-top: 2px;
            white-space: nowrap;
        }

        .bar[aria-disabled="true"] {
            color: rgba(255, 255, 255, 0.72);
        }

        /* ---------- Overlays ---------- */

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(12, 10, 8, 0.32);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .card {
            width: min(440px, 100%);
            max-height: 100%;
            overflow-y: auto;
            padding: 26px 24px 24px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .card h1 {
            font-family: var(--cond);
            font-weight: 700;
            font-size: 56px;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .card h1 em {
            color: var(--copper-lt);
        }

        .card h2 {
            font-size: 15px;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .card p {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.82);
            margin-top: 12px;
        }

        .card .kicker {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .field {
            display: block;
            margin-top: 20px;
        }

        .field span {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .field input, .field textarea {
            width: 100%;
            padding: 11px 12px;
            font: inherit;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--line-soft);
        }

        .field textarea {
            min-height: 76px;
            resize: vertical;
            font-size: 14px;
        }

        .field input::placeholder, .field textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .cta {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            background: #fff;
            color: #000;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: background 0.2s ease, opacity 0.2s ease;
        }

        .cta:hover {
            background: var(--copper-lt);
        }

        .cta:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            background: #fff;
        }

        .cta.ghost {
            background: transparent;
            color: #fff;
            border: 1px solid var(--line-soft);
            margin-top: 10px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .choice {
            height: 124px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.06);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .choice:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .choice b {
            font-family: var(--cond);
            font-size: 58px;
            line-height: 1;
        }

        .choice small {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--muted);
        }

        .choice[aria-pressed="true"] {
            background: rgba(184, 115, 51, 0.5);
            border-color: var(--copper-lt);
        }

        .toast {
            position: absolute;
            left: 50%;
            top: 24px;
            transform: translate(-50%, -8px);
            max-width: calc(100% - 32px);
            padding: 10px 16px;
            font-size: 13px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .cal {
            position: absolute;
            left: 12px;
            bottom: 70px;
            width: 320px;
            z-index: 26;
            padding: 10px;
            background: var(--glass-strong);
            border: 1px solid var(--line);
            font-family: var(--mono);
            font-size: 11px;
        }

        .cal textarea {
            width: 100%;
            height: 150px;
            margin-top: 6px;
            font: inherit;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--line-soft);
        }

        @media (max-width: 760px) {
            .panel {
                top: 12px;
                width: calc(50% - 18px);
            }

            .panel-left {
                left: 12px;
            }

            .panel-right {
                right: 12px;
            }

            .panel-left.expanded, .panel-right.open {
                width: calc(100% - 24px);
                z-index: 8;
            }

            .panel-head {
                font-size: 12px;
                padding: 10px 12px 6px;
            }

            .panel-song {
                gap: 10px;
                padding: 4px 12px 10px;
            }

            .cover {
                width: 30px;
                height: 30px;
            }

            .song-title {
                font-size: 13px;
            }

            .song-sub {
                font-size: 11px;
            }

            .panel-foot {
                padding: 10px 12px;
            }

            .lyrics {
                font-size: 12px;
                max-height: 3.2em;
            }

            .dots {
                gap: 3px;
            }

            .dots i {
                width: 6px;
                height: 6px;
            }

            .bars {
                gap: 6px;
                left: 6px;
                right: 6px;
                bottom: 6px;
            }

            .bar {
                height: 48px;
                font-size: 14px;
            }

            .bar .time {
                display: none;
            }

            .xfader {
                width: 170px;
                bottom: 68px;
            }

            .hint {
                bottom: 136px;
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .scene {
                transition-duration: 0.01s;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="wordmark">AB/noCD<sup>®</sup></div>
        <div class="collections" id="collections" role="tablist" aria-label="Collections"></div>
    </nav>

    <main class="stage" id="stage">
        <div class="scene" id="scene">
            <img id="backdrop" alt="">
            <svg id="hardware" viewBox="0 0 1600 900" aria-hidden="true"></svg>
        </div>

        <!-- Lyrics -->
        <section class="panel panel-left" id="lyricsPanel">
            <button class="panel-head" id="lyricsToggle" aria-expanded="false" aria-controls="lyricsText">
                <span>Lyrics</span>
                <svg class="chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="#fff" stroke-width="1.3"/></svg>
            </button>
            <div class="panel-song">
                <div class="cover" id="lyricsCover"></div>
                <div class="song-meta">
                    <div class="song-title" id="lyricsTitle">–</div>
                    <div class="song-sub" id="lyricsArtist"></div>
                </div>
            </div>
            <div class="panel-foot">
                <div class="lyrics" id="lyricsText" tabindex="0"></div>
            </div>
        </section>

        <!-- Song picker -->
        <section class="panel panel-right" id="pickerPanel">
            <button class="panel-head" id="pickerToggle" aria-expanded="false" aria-controls="pickerList">
                <span id="pickerName">Collection</span>
                <svg class="chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="#fff" stroke-width="1.3"/></svg>
            </button>
            <div class="panel-song">
                <div class="cover" id="pickerCover"></div>
                <div class="song-meta">
                    <div class="song-title" id="pickerTitle">–</div>
                    <div class="song-sub" id="pickerSub"></div>
                </div>
            </div>
            <div class="picker-list" id="pickerList"></div>
            <div class="panel-foot picker-foot">
                <button class="step" id="prevSong" aria-label="Previous song">
                    <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 1v10M10 1.5L4 6l6 4.5z" fill="none" stroke="#fff" stroke-width="1.1"/></svg>
                </button>
                <button class="step" id="nextSong" aria-label="Next song">
                    <svg viewBox="0 0 12 12" width="12" height="12"><path d="M10 1v10M2 1.5L8 6l-6 4.5z" fill="none" stroke="#fff" stroke-width="1.1"/></svg>
                </button>
                <div class="dots" id="dots" aria-hidden="true"></div>
            </div>
        </section>

        <div class="hint" id="hint" aria-live="polite"></div>

        <div class="xfader" id="xfader">
            <div class="xfader-label">CROSSFADER</div>
            <div class="xfader-row" id="xfaderRow">
                <span>A</span>
                <div class="xfader-track" id="xfaderTrack"><div class="xfader-knob" id="xfaderKnob"></div></div>
                <span>B</span>
            </div>
        </div>

        <div class="bars">
            <button class="bar" id="barA" aria-pressed="false" aria-label="Play version A">
                <span class="prog"><i id="progA"></i></span>
                <svg class="state" id="stateA" viewBox="0 0 12 12"></svg>
                <span>A</span>
                <span class="time" id="timeA">0:00</span>
            </button>
            <button class="bar" id="barSelect" aria-label="Vote for A or B">
                <span>Select</span>
                <span class="sub" id="selectSub"></span>
            </button>
            <button class="bar" id="barB" aria-pressed="false" aria-label="Play version B">
                <span class="prog"><i id="progB"></i></span>
                <svg class="state" id="stateB" viewBox="0 0 12 12"></svg>
                <span>B</span>
                <span class="time" id="timeB">0:00</span>
            </button>
        </div>

        <!-- Welcome -->
        <div class="overlay open" id="welcome">
            <form class="card" id="welcomeForm" autocomplete="on">
                <div class="kicker">KŮA Listening Lab</div>
                <h1 style="margin-top:8px">AB/<em>no</em>CD</h1>
                <p>Every song here comes in two versions. Switch between A and B as often as you like – each one picks up where you left it. When you know which you'd keep, hit <b>Select</b> and vote.</p>
                <label class="field">
                    <span>Your first name</span>
                    <input type="text" id="listenerName" placeholder="First name" required maxlength="40">
                </label>
                <button class="cta" type="submit">Enter the room</button>
            </form>
        </div>

        <!-- Vote -->
        <div class="overlay" id="vote" role="dialog" aria-modal="true" aria-labelledby="voteTitle">
            <form class="card" id="voteForm">
                <div class="kicker" id="voteKicker"></div>
                <h2 id="voteTitle" style="margin-top:6px">Which did you prefer?</h2>
                <div class="choices">
                    <button type="button" class="choice" data-choice="A" aria-pressed="false"><b>A</b><small id="heardA"></small></button>
                    <button type="button" class="choice" data-choice="B" aria-pressed="false"><b>B</b><small id="heardB"></small></button>
                </div>
                <label class="field">
                    <span>Why? (optional)</span>
                    <textarea id="voteNote" maxlength="600" placeholder="What tipped it?"></textarea>
                </label>
                <button class="cta" type="submit" id="voteSubmit" disabled>Submit vote</button>
                <button class="cta ghost" type="button" id="voteCancel">Keep listening</button>
            </form>
        </div>

        <!-- Collection complete -->
        <div class="overlay" id="done">
            <div class="card">
                <div class="kicker">Collection complete</div>
                <h1 style="margin-top:8px;font-size:44px">Thank you.</h1>
                <p id="doneText"></p>
                <button class="cta" type="button" id="doneNext">Next collection</button>
                <button class="cta ghost" type="button" id="doneStay">Review my votes</button>
            </div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script>
        // ---------------------------------------------------------------
        // Configuration
        // ---------------------------------------------------------------

        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxijY8EBvHVBqVjDN8_jX_gf5qn25yG8DWe_tfUPFLnxEFszrmhcAjwXKU3cFqJCautKA/exec';

        // Seconds a listener must hear of each version before SELECT unlocks.
        const MIN_LISTEN = 15;

        const CONFIG = {
            // Path to the wide AI render (16:9). null = use the built-in placeholder scene.
            sceneImage: 'assets/scene-wide.jpg',
            // Camera focal points and zoom, in scene units (1600 × 900).
            views: {
                wide: { x: 800, y: 470, z: 1 },
                A: { x: 360, y: 528, z: 1.7 },
                B: { x: 1240, y: 528, z: 1.7 }
            },
            // Live hardware layered over the render. Re-place these with ?calibrate.
            overlays: {
                recA: { x: 472, y: 566, r: 86, squash: 0.06 },
                recB: { x: 1081, y: 566, r: 86, squash: 0.06 },
                meterL: { x: 760, y: 611, len: 25, face: [730, 581, 60, 28] },
                meterR: { x: 839, y: 611, len: 25, face: [808, 581, 62, 28] },
                led: { x: 683, y: 577 }
            }
        };

        // Collections come from /api/catalog, which the Studio (/studio) fills.
        // Each holds up to 10 songs with two versions (v1 = file A, v2 = file B);
        // listeners hear them in a random A/B order, fixed per listener.
        // The demo collections below play when the catalog is empty, unreachable or ?demo is set;
        // they synthesise their audio in the browser and never post votes.
        const DEMO_TITLES = [
            'Copper Light', 'Night Market', 'Slow Burn', 'Lusaka Rain', 'Blue Hour',
            'Second Wind', 'Paper Moon', 'Low Tide', 'Glasshouse', 'Northbound',
            'Red Earth', 'Afterimage', 'Small Hours', 'Heatwave', 'Kafue',
            'Static', 'Undertow', 'Golden Hour', 'Open Road', 'Last Call'
        ];

        const DEMO_LYRICS = [
            `Streetlights hum in a minor key\nEvery window a different song\nI keep the radio low for you\nIn case you call before too long\n\nHold on, hold on\nThe night is only half begun\nHold on, hold on\nWe'll find the morning, one by one\n\nCopper wire and a borrowed tune\nRunning circles round the room\nIf the record skips, let it play\nSome things sound better that way`,
            `Rain on the tin roof, counting time\nYou said the river knows the way\nI wrote your name on the window glass\nAnd watched it slowly fade away\n\nSo let it pour, let it pour\nI've been here before\nSo let it pour, let it pour\nI don't mind anymore\n\nThe kettle sings and the power's out\nWe dance to what the thunder plays\nTwo versions of the same old night\nI'd live it either way`,
            `Turn it up till the needle bends\nThis is the part where the story ends\nOr starts again, I can't decide\nTwo roads and I want both sides\n\nA or B, B or A\nTell me which one makes you stay\nA or B, B or A\nPlay it back another way\n\nDust on the sleeve and a crack in the sound\nSpin it slow, let it go around\nWhatever you choose I'll understand\nThe song was always in your hands`
        ];

        function demoCollection(id, name, offset) {
            const songs = [];
            for (let i = 0; i < 10; i++) {
                const seed = offset + i + 1;
                songs.push({
                    id: `${id}-${String(i + 1).padStart(2, '0')}`,
                    title: DEMO_TITLES[(offset + i) % DEMO_TITLES.length],
                    artist: 'KŮA · demo',
                    lyrics: DEMO_LYRICS[seed % DEMO_LYRICS.length],
                    v1: `demo:${seed}:1`,
                    v2: `demo:${seed}:2`
                });
            }
            return { id, name, demo: true, songs };
        }

        const DEMO_COLLECTIONS = [
            demoCollection('vol01', 'Vol. 01', 0),
            demoCollection('vol02', 'Vol. 02', 10)
        ];

        let COLLECTIONS = DEMO_COLLECTIONS;

        async function loadCatalog() {
            if (new URLSearchParams(location.search).has('demo')) return;
            try {
                const res = await fetch('/api/catalog', { cache: 'no-cache' });
                if (!res.ok) return;
                const { collections } = await res.json();
                if (collections?.length) COLLECTIONS = collections;
            } catch (e) {
                // No API (e.g. a plain static server) – stay on the demo collections.
            }
        }

        // ---------------------------------------------------------------
        // Persistence
        // ---------------------------------------------------------------

        const STORE_KEY = 'abnocd:v1';

        function loadStore() {
            const empty = { name: '', flips: {}, pos: {}, heard: {}, switches: {}, votes: {}, outbox: [] };
            try {
                const raw = localStorage.getItem(STORE_KEY);
                return raw ? Object.assign(empty, JSON.parse(raw)) : empty;
            } catch (e) {
                return empty;
            }
        }

        let store = loadStore();

        function saveStore() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify(store));
            } catch (e) {
                // Private mode or storage blocked – state lasts for this visit only.
            }
        }

        // ---------------------------------------------------------------
        // Helpers
        // ---------------------------------------------------------------

        const $ = (id) => document.getElementById(id);
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function fmt(sec) {
            if (!isFinite(sec) || sec < 0) sec = 0;
            const s = Math.floor(sec);
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        function mulberry(seed) {
            let a = seed >>> 0;
            return () => {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        let toastTimer = 0;
        function toast(msg) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
        }

        function coverStyle(s, idx) {
            if (s.cover) return `background-image:url("${encodeURI(s.cover)}")`;
            const h = (idx * 47 + 12) % 360;
            return `background:linear-gradient(135deg,hsl(${h} 42% 40%),hsl(${(h + 55) % 360} 48% 20%))`;
        }

            }

            const speaker = (x) => {
                let slats = '';
                for (let i = 0; i < 30; i++) slats += `<rect x="${10 + i * 5}" y="662" width="2.4" height="106" fill="#3d281b"/>`;
                return `<g transform="translate(${x} 0)">
                    <rect x="-10" y="764" width="190" height="16" fill="#000" opacity=".4" filter="url(#soft)"/>
                    <rect x="10" y="430" width="170" height="350" fill="#000" opacity=".2" filter="url(#soft)"/>
                    <rect x="0" y="420" width="170" height="355" fill="#3b2519"/>

                    <rect x="10" y="430" width="150" height="225" fill="url(#fabric)"/>
                    <circle cx="85" cy="535" r="63" fill="#0b0b0b"/>

                    <circle cx="85" cy="535" r="34" fill="none" stroke="rgba(255,255,255,.05)"/>
                    <circle cx="85" cy="535" r="15" fill="#151515" stroke="#2c2c2c"/>
                    <ellipse cx="76" cy="526" rx="7" ry="4" fill="#fff" opacity=".07"/>
                    <rect x="10" y="662" width="150" height="106" fill="#26170f"/>
                    ${slats}
                </g>`;
            };

            const plinth = (x, contents) => `<g transform="translate(${x} 0)">
                    <rect x="-6" y="764" width="192" height="14" fill="#000" opacity=".35" filter="url(#soft)"/>
                    <rect x="0" y="612" width="180" height="162" fill="#b3b1ac"/>

                    <rect x="12" y="630" width="156" height="132" fill="#7e7c78"/>

                    ${contents}
                    <rect x="8" y="597" width="164" height="15" fill="#1d1d1d"/>
                    <rect x="8" y="593" width="164" height="5" fill="#2c2c2c"/>
                    <ellipse cx="82" cy="590" rx="62" ry="8" fill="#0d0d0d"/>
                    <rect x="151" y="568" width="6" height="20" fill="#2d2d2d"/>
                    <circle cx="154" cy="568" r="5" fill="#444"/>
                    <line x1="154" y1="570" x2="122" y2="586" stroke="#d0d0d0" stroke-width="2"/>
                    <rect x="117" y="584" width="9" height="4" fill="#111"/>
                    <circle cx="20" cy="604" r="2" fill="#555"/>
                </g>`;

            const meter = (px, py, fx) => {
                let ticks = '';
                for (let a = -46; a <= 46; a += 11.5) {
                    const rad = a * Math.PI / 180;
                    const x1 = px + 30 * Math.sin(rad), y1 = py - 30 * Math.cos(rad);
                    const x2 = px + 34 * Math.sin(rad), y2 = py - 34 * Math.cos(rad);
                    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${a > 20 ? '#b8562f' : '#333'}" stroke-width=".8"/>`;
                }
                const arc = (a0, a1, rr) => {
                    const p = (a) => [px + rr * Math.sin(a * Math.PI / 180), py - rr * Math.cos(a * Math.PI / 180)].map((v) => v.toFixed(1)).join(' ');
                    return `M${p(a0)} A${rr} ${rr} 0 0 1 ${p(a1)}`;
                };
                return `<rect x="${fx}" y="556" width="92" height="46" fill="url(#meterFace)" stroke="#1d1d1f" stroke-width="2"/>

                    <circle cx="${x}" cy="731" r="13" fill="url(#knob)"/>

                    <line x1="${x}" y1="720" x2="${x}" y2="725" stroke="#333" stroke-width="1.4"/>
                    <text x="${x}" y="758" font-size="5.5" text-anchor="middle" fill="#3a3a3a" font-family="Helvetica,Arial,sans-serif">${label}</text>`;
            });

            return `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
                <defs>
                    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">

                    </linearGradient>

                    </linearGradient>

                    <radialGradient id="glow" cx=".5" cy=".55" r=".5">

                    <radialGradient id="disc" cx=".45" cy=".42" r=".6">
                        <stop offset="0" stop-color="#62241e"/><stop offset="1" stop-color="#3f150f"/>
                    </radialGradient>
                    <radialGradient id="cone" cx=".45" cy=".42" r=".6">
                        <stop offset="0" stop-color="#3b3b3b"/><stop offset="1" stop-color="#0c0c0c"/>

                    <radialGradient id="meterFace" cx=".5" cy=".9" r=".9">
                        <stop offset="0" stop-color="#f3ecd2"/><stop offset="1" stop-color="#d9d0ae"/>
                    </radialGradient>
                    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">

                    </linearGradient>

                    <pattern id="fabric" width="3" height="3" patternUnits="userSpaceOnUse">

                <rect width="1600" height="900" fill="url(#wall)"/>

                <rect y="772" width="1600" height="2" fill="rgba(0,0,0,.25)"/>

                ${speaker(255)}
                ${speaker(1175)}

                ${plinth(470, `<rect x="24" y="742" width="130" height="6" fill="#111"/>
                    <rect x="26" y="748" width="128" height="5" fill="#e8e6e0"/>

                ${plinth(958, `<rect x="24" y="714" width="132" height="22" fill="#7a2b22"/>
                    <text x="34" y="729" font-size="12" font-weight="700" fill="#f3ece4" font-family="Helvetica,Arial,sans-serif">AB/noCD®</text>

                    <text x="34" y="754" font-size="13" font-weight="700" fill="#2a2a2a" font-family="Helvetica,Arial,sans-serif">KŮA Vol. 01</text>`)}
