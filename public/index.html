                <rect x="772" y="639" width="56" height="1" fill="#b87333" opacity=".8"/>

                <rect x="660" y="656" width="280" height="2" fill="#b87333"/>
                <rect x="660" y="658" width="280" height="114" rx="3" fill="url(#steelLight)"/>
                <line x1="712" y1="690" x2="888" y2="690" stroke="#4d4d4d" stroke-width="3"/>
                <rect x="796" y="683" width="9" height="14" fill="#e6e6e6" stroke="#666" stroke-width=".6"/>
                <circle cx="683" cy="690" r="5" fill="url(#knob)"/>
                <circle cx="917" cy="690" r="5" fill="url(#knob)"/>
                ${lowerKnobs}

                <rect width="1600" height="900" fill="url(#vignette)"/>
            </svg>`;
        }

        async function buildBackdrop() {
            const img = $('backdrop');
            if (CONFIG.sceneImage) {
                img.src = CONFIG.sceneImage;
                return;
            }
            const svgUrl = URL.createObjectURL(new Blob([placeholderSVG()], { type: 'image/svg+xml' }));
            try {
                // Rasterise once so camera moves don't re-run the SVG filters.
                const src = new Image();
                src.src = svgUrl;
                await src.decode();
                const canvas = document.createElement('canvas');
                canvas.width = 3200;
                canvas.height = 1800;
                canvas.getContext('2d').drawImage(src, 0, 0, 3200, 1800);
                const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.9));
                img.src = blob ? URL.createObjectURL(blob) : svgUrl;
            } catch (e) {
                img.src = svgUrl;
            }
        }

        // ---------------------------------------------------------------
        // Live hardware overlay: records, VU needles, power LED
        // ---------------------------------------------------------------

        const hw = {};

        function buildHardware() {
            const o = CONFIG.overlays;
            const record = (id, c) => {
                const L = c.r * 0.38;
                let grooves = '';
                for (let rr = L + 3; rr < c.r - 1; rr += 2.6) grooves += `<circle r="${rr.toFixed(1)}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width=".7"/>`;
                return `<rect x="${c.x - c.r}" y="${c.y}" width="${2 * c.r}" height="2.6" fill="#050505"/>
                    <g transform="translate(${c.x} ${c.y}) scale(1 ${c.squash})">
                        <g id="${id}">
                            <circle r="${c.r}" fill="#0c0c0c"/>
                            ${grooves}
                            <path d="M0 ${-L} A${L} ${L} 0 0 1 0 ${L} Z" fill="#d8483f"/>
                            <path d="M0 ${L} A${L} ${L} 0 0 1 0 ${-L} Z" fill="#3b5bd6"/>
                            <rect x="-2.5" y="${-L + 3}" width="5" height="9" fill="#f4efe6"/>
                            <circle r="2.4" fill="#d9d9d9"/>
                        </g>
                        <path d="M${-c.r * 0.8} ${-c.r * 0.45} A${c.r} ${c.r} 0 0 1 ${c.r * 0.2} ${-c.r * 0.95}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
                    </g>`;
            };
            const needle = (id, m) => {
                const [fx, fy, fw, fh] = m.face;
                return `<clipPath id="clip-${id}"><rect x="${fx + 1}" y="${fy + 1}" width="${fw - 2}" height="${fh - 2}"/></clipPath>
                    <g clip-path="url(#clip-${id})">
                        <g id="${id}">
                            <line x1="${m.x + 1.2}" y1="${m.y}" x2="${m.x + 1.2}" y2="${m.y - m.len}" stroke="#000" stroke-opacity=".18" stroke-width="1.3"/>
                            <line x1="${m.x}" y1="${m.y}" x2="${m.x}" y2="${m.y - m.len}" stroke="#2e1d12" stroke-width="1.1" stroke-linecap="round"/>
                        </g>
                        <circle cx="${m.x}" cy="${m.y + 1}" r="4" fill="#222"/>
                    </g>`;
            };
            $('hardware').innerHTML = `
                <defs>
                    <radialGradient id="ledGlow"><stop offset="0" stop-color="#ff4a3a" stop-opacity=".8"/><stop offset="1" stop-color="#ff4a3a" stop-opacity="0"/></radialGradient>
                </defs>
                ${record('recA', o.recA)}
                ${record('recB', o.recB)}
                ${needle('needleL', o.meterL)}
                ${needle('needleR', o.meterR)}
                <g id="led" opacity=".2">
                    <circle cx="${o.led.x}" cy="${o.led.y}" r="10" fill="url(#ledGlow)"/>
                    <circle cx="${o.led.x}" cy="${o.led.y}" r="2.6" fill="#ff3b2f"/>
                </g>
                <g id="calHandles"></g>`;
            hw.recA = $('recA');
            hw.recB = $('recB');
            hw.needleL = $('needleL');
            hw.needleR = $('needleR');
            hw.led = $('led');
        }

        // ---------------------------------------------------------------
        // Camera
        // ---------------------------------------------------------------

        let view = 'wide';
        let cam = { tx: 0, ty: 0, S: 1 };

        function applyCamera(animate = true) {
            const stage = $('stage');
            const W = stage.clientWidth, H = stage.clientHeight;
            const cover = Math.max(W / 1600, H / 900);
            const v = CONFIG.views[view];
            // Portrait screens are already tightly cropped; push in less.
            const z = W < H ? (view === 'wide' ? 1 : 1.25) : v.z;
            const S = cover * z;
            const tx = clamp(W / 2 - v.x * S, W - 1600 * S, 0);
            const ty = clamp(H / 2 - v.y * S, H - 900 * S, 0);
            const scene = $('scene');
            scene.style.transition = animate ? '' : 'none';
            scene.style.transform = `translate(${tx}px, ${ty}px) scale(${S})`;
            cam = { tx, ty, S };
        }

        // ---------------------------------------------------------------
        // Demo audio – two arrangements of the same song, synthesised offline
        // ---------------------------------------------------------------

        const demoCache = new Map();

        function resolveUrl(url) {
            if (!url.startsWith('demo:')) return Promise.resolve(url);
            if (!demoCache.has(url)) demoCache.set(url, renderDemo(url));
            return demoCache.get(url);
        }

        async function renderDemo(url) {
            const [, seedStr, verStr] = url.split(':');
            const seed = Number(seedStr), alt = verStr === '2';
            const sr = 22050, dur = 40;
            const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            const ctx = new OAC(2, sr * dur, sr);

            const master = ctx.createGain();
            master.gain.setValueAtTime(0, 0);
            master.gain.linearRampToValueAtTime(0.7, 0.05);
            master.gain.setValueAtTime(0.7, dur - 2.5);
            master.gain.linearRampToValueAtTime(0, dur);
            const comp = ctx.createDynamicsCompressor();
            master.connect(comp);
            comp.connect(ctx.destination);

            const noise = ctx.createBuffer(1, sr, sr);
            const nd = noise.getChannelData(0);
            for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

            const pan = (p) => {
                const n = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
                if (n.pan) n.pan.value = p;
                n.connect(master);
                return n;
            };

            // Shared harmony and melody; arrangement differs per version.
            const rng = mulberry(seed * 97 + 13);
            const bpm = 78 + (seed * 11) % 34;
            const beat = 60 / bpm;
            const bars = Math.floor((dur - 1) / (beat * 4));
            const root = 45 + (seed * 5) % 12;
            const minor = seed % 3 !== 0;
            const scale = minor ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 5, 7, 9, 11];
            const progs = [[0, 5, 3, 4], [0, 3, 5, 4], [5, 3, 0, 4], [0, 4, 5, 3]];
            const prog = progs[seed % progs.length];
            const deg = (d) => scale[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
            const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

            const tone = (type, freq, t, len, gain, dest, cutoff) => {
                const o = ctx.createOscillator();
                o.type = type;
                o.frequency.value = freq;
                const g = ctx.createGain();
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(gain, t + Math.min(0.25, len * 0.3));
                g.gain.setValueAtTime(gain, t + len * 0.7);
                g.gain.linearRampToValueAtTime(0, t + len);
                let node = o;
                if (cutoff) {
                    const f = ctx.createBiquadFilter();
                    f.type = 'lowpass';
                    f.frequency.value = cutoff;
                    o.connect(f);
                    node = f;
                }
                node.connect(g);
                g.connect(dest);
                o.start(t);
                o.stop(t + len + 0.05);
            };

            const hit = (t, type, gain, dest) => {
                if (type === 'kick') {
                    const o = ctx.createOscillator();
                    o.frequency.setValueAtTime(130, t);
                    o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
                    const g = ctx.createGain();
                    g.gain.setValueAtTime(gain, t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
                    o.connect(g);
                    g.connect(dest);
                    o.start(t);
                    o.stop(t + 0.35);
                    return;
                }
                const s = ctx.createBufferSource();
                s.buffer = noise;
                const f = ctx.createBiquadFilter();
                f.type = type === 'snare' ? 'bandpass' : 'highpass';
                f.frequency.value = type === 'snare' ? 1800 : 7000;
                const g = ctx.createGain();
                const len = type === 'snare' ? 0.18 : 0.045;
                g.gain.setValueAtTime(gain, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + len);
                s.connect(f);
                f.connect(g);
                g.connect(dest);
                s.start(t, rng() * 0.5);
                s.stop(t + len + 0.02);
            };

            const padL = pan(alt ? -0.25 : -0.6), padR = pan(alt ? 0.25 : 0.6), mid = pan(0);
            const hats = pan(alt ? -0.35 : 0.35), lead = pan(alt ? 0.15 : -0.15);
            const melody = [];
            for (let b = 0; b < bars; b++) {
                const notes = [];
                for (let n = 0; n < 4; n++) notes.push(prog[b % 4] + [0, 2, 4, 7, 4, 2][Math.floor(rng() * 6)]);
                melody.push(notes);
            }

            for (let b = 0; b < bars; b++) {
                const t0 = 0.5 + b * beat * 4;
                const d = prog[b % 4];
                const chord = [0, 2, 4].map((k) => root + 12 + deg(d + k));
                chord.forEach((m, i) => tone(alt ? 'triangle' : 'sawtooth', hz(m), t0, beat * 4, alt ? 0.06 : 0.035, [padL, mid, padR][i], alt ? 900 : 2200));

                const bassM = root + deg(d) - (alt ? 12 : 0);
                if (alt) {
                    tone('sine', hz(bassM), t0, beat * 2, 0.32, mid);
                    tone('sine', hz(bassM + 7), t0 + beat * 2, beat * 2, 0.28, mid);
                } else {
                    [1, 0, 1, 1, 0, 1, 0, 1].forEach((on, i) => on && tone('triangle', hz(bassM), t0 + i * beat / 2, beat * 0.45, 0.22, mid));
                }

                for (let q = 0; q < 4; q++) {
                    const t = t0 + q * beat;
                    if (alt) {
                        if (q === 0) hit(t, 'kick', 0.9, mid);
                        if (q === 1) hit(t + beat / 2, 'kick', 0.6, mid);
                        if (q === 2) hit(t, 'snare', 0.35, mid);
                        hit(t, 'hat', 0.08, hats);
                        hit(t + beat * 0.62, 'hat', 0.05, hats);
                    } else {
                        if (q === 0 || q === 2) hit(t, 'kick', 0.85, mid);
                        if (q === 2) hit(t + beat / 2, 'kick', 0.5, mid);
                        if (q === 1 || q === 3) hit(t, 'snare', 0.32, mid);
                        for (let s = 0; s < 4; s++) hit(t + s * beat / 4, 'hat', s % 2 ? 0.035 : 0.07, hats);
                    }
                }

                if (!alt || b >= bars / 2) {
                    melody[b].forEach((m, i) => tone(alt ? 'sine' : 'square', hz(root + 24 + deg(m) - (alt ? 12 : 0)), t0 + i * beat, beat * 0.9, alt ? 0.09 : 0.03, lead, 2600));
                }
            }

            const buf = await ctx.startRendering();
            return URL.createObjectURL(wavBlob(buf));
        }

        function wavBlob(ab) {
            const ch = ab.numberOfChannels, len = ab.length, sr = ab.sampleRate;
            const dv = new DataView(new ArrayBuffer(44 + len * ch * 2));
            const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
            w(0, 'RIFF'); dv.setUint32(4, 36 + len * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
            dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true);
            dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true);
            dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, len * ch * 2, true);
            const data = [];
            for (let c = 0; c < ch; c++) data.push(ab.getChannelData(c));
            let o = 44;
            for (let i = 0; i < len; i++) {
                for (let c = 0; c < ch; c++) {
                    const s = clamp(data[c][i], -1, 1);
                    dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
                    o += 2;
                }
            }
            return new Blob([dv], { type: 'audio/wav' });
        }

        // ---------------------------------------------------------------
        // Decks
        // ---------------------------------------------------------------

        let actx = null;

        function audioCtx() {
            if (!actx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (C) actx = new C();
            }
            if (actx && actx.state === 'suspended') actx.resume();
            return actx;
        }

        function makeDeck(key) {
            return { key, el: null, version: null, analysable: false, src: null, gain: null, an: null, buf: null, vol: 1, volTarget: 1, pauseWhenSilent: false, angle: key === 'A' ? 40 : 200, speed: 0 };
        }

        const decks = { A: makeDeck('A'), B: makeDeck('B') };
        let collection = null, songIdx = 0, song = null, live = null, loading = false, loadToken = 0;
        const meters = { L: 0, R: 0 };

        function isPlaying(d) {
            return !!(d.el && !d.el.paused && !d.pauseWhenSilent);
        }

        function disposeDeck(d) {
            if (d.el) {
                d.el.pause();
                d.el.removeAttribute('src');
                d.el.load();
            }
            if (d.src) {
                try { d.src.disconnect(); } catch (e) { /* already disconnected */ }
            }
            Object.assign(d, { el: null, version: null, posKey: null, analysable: false, src: null, gain: null, an: null, buf: null, vol: 1, volTarget: 1, pauseWhenSilent: false });
        }

        function attachDeck(d, url, version, songId, rev) {
            disposeDeck(d);
            const el = new Audio();
            el.preload = 'auto';
            d.el = el;
            d.version = version;
            // Replacing a version in the Studio changes its rev, so stale positions are ignored.
            d.posKey = rev ? `${version}@${rev}` : version;
            const sameOrigin = url.startsWith('blob:') || new URL(url, location.href).origin === location.origin;
            let retried = false;
            d.analysable = sameOrigin;
            // Ask for CORS so the analyser can read the signal; fall back to plain playback if refused.
            if (!sameOrigin) el.crossOrigin = 'anonymous';
            el.addEventListener('error', () => {
                if (d.el !== el) return;
                if (!sameOrigin && !retried) {
                    retried = true;
                    el.removeAttribute('crossorigin');
                    el.src = url;
                    el.load();
                } else {
                    toast(`Couldn't load version ${d.key}.`);
                }
            });
            el.addEventListener('loadedmetadata', () => {
                if (d.el !== el) return;
                d.analysable = sameOrigin || !retried;
                if (!el.paused) wire(d);
                const p = store.pos[songId]?.[d.posKey];
                if (p && p < el.duration - 1) el.currentTime = p;
                renderTimes();
            });
            el.addEventListener('ended', () => {
                savePositions();
                updateUI();
            });
            el.src = url;
        }

        function wire(d) {
            if (d.gain || !d.analysable) return;
            const ctx = audioCtx();
            if (!ctx) return;
            try {
                const src = ctx.createMediaElementSource(d.el);
                const gain = ctx.createGain();
                src.connect(gain);
                gain.connect(ctx.destination);
                const split = ctx.createChannelSplitter(2);
                gain.connect(split);
                const an = [ctx.createAnalyser(), ctx.createAnalyser()];
                an.forEach((a, i) => {
                    a.fftSize = 1024;
                    split.connect(a, i);
                });
                Object.assign(d, { src, gain, an, buf: new Float32Array(1024) });
                d.el.volume = 1;
            } catch (e) {
                d.analysable = false;
            }
        }

        function applyVol(d) {
            if (d.gain) d.gain.gain.value = d.vol;
            else if (d.el) d.el.volume = d.vol;
        }

        function startDeck(d) {
            wire(d);
            d.vol = 0;
            d.volTarget = 1;
            d.pauseWhenSilent = false;
            applyVol(d);
            const p = d.el.play();
            if (p) p.catch((err) => {
                if (err.name !== 'AbortError') toast('Playback was blocked – tap again.');
                updateUI();
            });
        }

        function fadeOut(d) {
            if (!d.el || d.el.paused) return;
            d.volTarget = 0;
            d.pauseWhenSilent = true;
        }

        function pressDeck(key) {
            if (!song || loading || !decks[key].el) return;
            audioCtx();
            closeMenus();
            const d = decks[key];
            if (live === key) {
                if (isPlaying(d)) fadeOut(d);
                else startDeck(d);
            } else {
                if (live) {
                    fadeOut(decks[live]);
                    store.switches[song.id] = (store.switches[song.id] || 0) + 1;
                }
                live = key;
                view = key;
                applyCamera();
                startDeck(d);
            }
            savePositions();
            updateUI();
        }

        function savePositions() {
            if (!song) return;
            const pos = store.pos[song.id] || (store.pos[song.id] = {});
            for (const d of Object.values(decks)) {
                if (d.el && d.posKey && isFinite(d.el.currentTime)) pos[d.posKey] = d.el.currentTime;
            }
            saveStore();
        }

        function heard(d) {
            return (song && d.version && store.heard[song.id]?.[d.version]) || 0;
        }

        function remaining(key) {
            const d = decks[key];
            const dur = d.el?.duration;
            const need = isFinite(dur) && dur > 0 ? Math.min(MIN_LISTEN, dur * 0.8) : MIN_LISTEN;
            return Math.max(0, need - heard(d));
        }

        function flipFor(id) {
            if (!(id in store.flips)) {
                store.flips[id] = Math.random() < 0.5;
                saveStore();
            }
            return store.flips[id];
        }

        // ---------------------------------------------------------------
        // Song & collection selection
        // ---------------------------------------------------------------

        async function selectSong(idx) {
            const token = ++loadToken;
            savePositions();
            Object.values(decks).forEach(disposeDeck);
            songIdx = clamp(idx, 0, collection.songs.length - 1);
            song = collection.songs[songIdx];
            live = null;
            view = 'wide';
            loading = true;
            applyCamera();
            closeMenus();
            updateUI();

            const flip = flipFor(song.id);
            const versions = { A: flip ? 'v2' : 'v1', B: flip ? 'v1' : 'v2' };
            try {
                const urls = await Promise.all(['A', 'B'].map((k) => resolveUrl(song[versions[k]])));
                if (token !== loadToken) return;
                attachDeck(decks.A, urls[0], versions.A, song.id, song.revs?.[versions.A]);
                attachDeck(decks.B, urls[1], versions.B, song.id, song.revs?.[versions.B]);
            } catch (e) {
                if (token === loadToken) toast('Could not load this song.');
            }
            if (token !== loadToken) return;
            loading = false;
            updateUI();
        }

        function selectCollection(ci) {
            collection = COLLECTIONS[ci];
            const next = collection.songs.findIndex((s) => !store.votes[s.id]);
            selectSong(next === -1 ? 0 : next);
        }

        function votedCount(c) {
            return c.songs.filter((s) => store.votes[s.id]).length;
        }

        // ---------------------------------------------------------------
        // Voting
        // ---------------------------------------------------------------

        let pendingChoice = null;

        function openVote() {
            if (!song || loading) return;
            const ra = remaining('A'), rb = remaining('B');
            if (ra > 0 || rb > 0) {
                const parts = [];
                if (ra > 0) parts.push(`A needs ${Math.ceil(ra)}s more`);
                if (rb > 0) parts.push(`B needs ${Math.ceil(rb)}s more`);
                toast(`Give each version ${MIN_LISTEN} seconds first – ${parts.join(', ')}.`);
                return;
            }
            Object.values(decks).forEach(fadeOut);
            live = null;
            view = 'wide';
            applyCamera();
            closeMenus();

            const prior = store.votes[song.id];
            pendingChoice = prior ? prior.choice : null;
            $('voteKicker').textContent = `${collection.name} · ${String(songIdx + 1).padStart(2, '0')} · ${song.title}`;
            $('heardA').textContent = `heard ${fmt(heard(decks.A))}`;
            $('heardB').textContent = `heard ${fmt(heard(decks.B))}`;
            $('voteNote').value = prior ? prior.note : '';
            $('voteSubmit').textContent = prior ? 'Update vote' : 'Submit vote';
            renderChoice();
            $('toast').classList.remove('show');
            $('vote').classList.add('open');
            updateUI();
            setTimeout(() => document.querySelector('.choice').focus(), 50);
        }

        function closeVote() {
            $('vote').classList.remove('open');
        }

        function renderChoice() {
            document.querySelectorAll('.choice').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.choice === pendingChoice)));
            $('voteSubmit').disabled = !pendingChoice;
        }

        function submitVote(e) {
            e.preventDefault();
            if (!pendingChoice || !song) return;
            const d = decks[pendingChoice];
            const prior = store.votes[song.id];
            const note = $('voteNote').value.trim();
            store.votes[song.id] = { choice: pendingChoice, version: d.version, note, at: new Date().toISOString() };
            saveStore();
            sendVote({
                type: 'abvote',
                timestamp: new Date().toISOString(),
                listenerName: store.name,
                collection: collection.id,
                songId: song.id,
                songTitle: song.title,
                choseVersion: d.version,
                shownAs: pendingChoice,
                secondsA: Math.round(heard(decks.A)),
                secondsB: Math.round(heard(decks.B)),
                switches: store.switches[song.id] || 0,
                revote: !!prior,
                note
            });
            closeVote();
            toast(prior ? 'Vote updated.' : `Voted ${pendingChoice}. Thank you.`);
            updateUI();

            const next = collection.songs.findIndex((s, i) => i > songIdx && !store.votes[s.id]);
            const wrap = collection.songs.findIndex((s) => !store.votes[s.id]);
            if (prior) return;
            if (next !== -1 || wrap !== -1) setTimeout(() => selectSong(next !== -1 ? next : wrap), 700);
            else setTimeout(showDone, 700);
        }

        async function sendVote(payload) {
            if (collection.demo) {
                console.info('[AB/noCD demo] vote not sent:', payload);
                return;
            }
            store.outbox.push(payload);
            saveStore();
            await flushOutbox();
        }

        async function flushOutbox() {
            while (store.outbox.length) {
                try {
                    // no-cors + text/plain: Apps Script receives it without a CORS preflight.
                    await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(store.outbox[0]) });
                    store.outbox.shift();
                    saveStore();
                } catch (e) {
                    return; // Offline – retry on next vote or visit.
                }
            }
        }

        function showDone() {
            const nextIdx = COLLECTIONS.findIndex((c) => votedCount(c) < c.songs.length);
            const more = collection.total > collection.songs.length ? ` More songs are on the way – check back soon.` : '';
            $('doneText').textContent = `You've voted on all ${collection.songs.length} songs in ${collection.name}. Your picks decide which versions get released.${more}`;
            $('doneNext').hidden = nextIdx === -1;
            $('doneNext').dataset.c = nextIdx;
            $('done').classList.add('open');
        }

        // ---------------------------------------------------------------
        // Rendering
        // ---------------------------------------------------------------

        const ICON_PLAY = '<path d="M3 1.5l7 4.5-7 4.5z" fill="#fff"/>';
        const ICON_PAUSE = '<path d="M3 1.5h2v9H3zM7 1.5h2v9H7z" fill="#fff"/>';

        function updateUI() {
            $('collections').innerHTML = COLLECTIONS.map((c, i) =>
                `<button role="tab" data-c="${i}" aria-current="${c === collection}" aria-selected="${c === collection}">${esc(c.name)}<sup>${votedCount(c)}/${c.songs.length}</sup></button>`
            ).join('');
            if (!song) return;

            const cover = coverStyle(song, songIdx + COLLECTIONS.indexOf(collection) * 10);
            const num = String(songIdx + 1).padStart(2, '0');
            const vote = store.votes[song.id];

            $('lyricsCover').setAttribute('style', cover);
            $('lyricsCover').textContent = song.cover ? '' : num;
            $('lyricsTitle').textContent = song.title;
            $('lyricsArtist').textContent = song.artist || '';
            $('lyricsText').textContent = song.lyrics || 'No lyrics for this song yet.';

            $('pickerName').textContent = collection.name;
            $('pickerCover').setAttribute('style', cover);
            $('pickerCover').textContent = song.cover ? '' : num;
            $('pickerTitle').textContent = song.title;
            const soFar = collection.total > collection.songs.length ? ' · more coming' : '';
            $('pickerSub').textContent = `Song ${songIdx + 1} of ${collection.songs.length}${soFar}${vote ? ` · voted ${vote.choice}` : ''}`;
            $('pickerList').innerHTML = collection.songs.map((s, i) => {
                const v = store.votes[s.id];
                return `<button data-s="${i}" class="${i === songIdx ? 'current' : ''}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span>${esc(s.title)}</span><span class="v">${v ? `✓ ${v.choice}` : ''}</span></button>`;
            }).join('');
            $('dots').innerHTML = collection.songs.map((s, i) => `<i class="${store.votes[s.id] ? 'voted' : ''} ${i === songIdx ? 'current' : ''}"></i>`).join('');
            $('prevSong').disabled = songIdx === 0;
            $('nextSong').disabled = songIdx === collection.songs.length - 1;

            for (const k of ['A', 'B']) {
                const active = live === k;
                const playing = isPlaying(decks[k]);
                $('bar' + k).classList.toggle('active', active);
                $('bar' + k).setAttribute('aria-pressed', String(active && playing));
                $('state' + k).innerHTML = active ? (playing ? ICON_PAUSE : ICON_PLAY) : '';
            }

            const xf = $('xfader');
            xf.classList.toggle('live', !!live);
            if (!xf.classList.contains('dragging')) $('xfaderKnob').style.left = live === 'A' ? '0%' : live === 'B' ? '100%' : '50%';

            renderTimes();
            renderGate();
        }

        function renderTimes() {
            for (const k of ['A', 'B']) {
                const el = decks[k].el;
                const dur = el?.duration;
                const pct = el && isFinite(dur) && dur > 0 ? (el.currentTime / dur) * 100 : 0;
                $('prog' + k).style.width = `${pct}%`;
                $('time' + k).textContent = el ? fmt(el.currentTime) : '0:00';
            }
        }

        function renderGate() {
            if (!song) return;
            const vote = store.votes[song.id];
            const ra = remaining('A'), rb = remaining('B');
            const ready = ra === 0 && rb === 0;
            $('barSelect').setAttribute('aria-disabled', String(!ready));
            $('selectSub').textContent = vote
                ? `VOTED ${vote.choice} · CHANGE`
                : ready ? 'READY TO VOTE' : `A ${Math.ceil(ra)}S · B ${Math.ceil(rb)}S`;

            let hint = '';
            const anyPlaying = isPlaying(decks.A) || isPlaying(decks.B);
            if (loading) hint = 'Pressing records…';
            else if (!anyPlaying && !$('vote').classList.contains('open')) hint = vote ? `You picked ${vote.choice} · tap A or B to listen again` : live ? 'Paused · tap A or B' : 'Tap A or B to start listening';
            else if (anyPlaying && ready && !vote) hint = 'Heard enough? Tap SELECT to vote';
            if ($('hint').textContent !== hint) $('hint').textContent = hint;
        }

        function closeMenus() {
            $('pickerPanel').classList.remove('open');
            $('pickerToggle').setAttribute('aria-expanded', 'false');
        }

        // ---------------------------------------------------------------
        // Animation loop: fades, platters, needles, LED, listening time
        // ---------------------------------------------------------------

        let lastFrame = performance.now(), clock = 0, slowTimer = 0, saveTimer = 0, ledLevel = 0;

        function rmsLevel(an, buf) {
            an.getFloatTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
            const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-6);
            return clamp((db + 36) / 33, 0, 1.1);
        }

        function frame(now) {
            const dt = Math.min(0.1, (now - lastFrame) / 1000);
            lastFrame = now;
            clock += dt;
            let anyPlaying = false;

            for (const d of Object.values(decks)) {
                if (d.el && d.vol !== d.volTarget) {
                    const step = dt / 0.12;
                    d.vol = d.vol < d.volTarget ? Math.min(d.volTarget, d.vol + step) : Math.max(d.volTarget, d.vol - step);
                    applyVol(d);
                }
                if (d.pauseWhenSilent && d.vol <= 0) {
                    d.el.pause();
                    d.pauseWhenSilent = false;
                    savePositions();
                    updateUI();
                }

                const rolling = !!(d.el && !d.el.paused && d.el.readyState >= 3);
                const target = rolling ? 1 : 0;
                d.speed += (target - d.speed) * (1 - Math.exp(-dt / (target > d.speed ? 0.22 : 0.4)));
                d.angle = (d.angle + d.speed * 200 * dt) % 360; // 33⅓ rpm = 200°/s
                hw['rec' + d.key]?.setAttribute('transform', `rotate(${d.angle.toFixed(2)})`);

                if (rolling && !d.pauseWhenSilent && !d.el.seeking && song) {
                    anyPlaying = true;
                    const h = store.heard[song.id] || (store.heard[song.id] = {});
                    h[d.version] = (h[d.version] || 0) + dt;
                }
            }

            // VU meters follow the live deck: real signal when readable, otherwise a plausible simulation.
            let tL = 0, tR = 0;
            const src = live && decks[live].el && !decks[live].el.paused ? decks[live] : null;
            if (src) {
                if (src.an && actx && actx.state === 'running') {
                    tL = rmsLevel(src.an[0], src.buf);
                    tR = rmsLevel(src.an[1], src.buf);
                    if (tR < 0.02 && tL > 0.05) tR = tL * 0.97; // mono source
                } else {
                    const pulse = Math.pow(Math.max(0, Math.sin(clock * Math.PI * 2 * 0.8)), 6);
                    tL = 0.52 + 0.14 * Math.sin(clock * 2.1) + 0.08 * Math.sin(clock * 5.3 + 1) + 0.18 * pulse;
                    tR = 0.5 + 0.14 * Math.sin(clock * 1.9 + 0.7) + 0.08 * Math.sin(clock * 6.1) + 0.16 * pulse;
                }
                tL *= src.vol;
                tR *= src.vol;
            }
            const tau = src ? 0.3 : 0.6;
            const k = 1 - Math.exp(-dt / tau);
            meters.L += (tL - meters.L) * k;
            meters.R += (tR - meters.R) * k;
            const jitter = () => (src ? (Math.random() - 0.5) * 0.012 : 0);
            const o = CONFIG.overlays;
            hw.needleL?.setAttribute('transform', `rotate(${(-46 + clamp(meters.L + jitter(), 0, 1.12) * 92).toFixed(2)} ${o.meterL.x} ${o.meterL.y})`);
            hw.needleR?.setAttribute('transform', `rotate(${(-46 + clamp(meters.R + jitter(), 0, 1.12) * 92).toFixed(2)} ${o.meterR.x} ${o.meterR.y})`);

            ledLevel += ((anyPlaying ? 1 : 0.2) - ledLevel) * (1 - Math.exp(-dt / 0.15));
            hw.led?.setAttribute('opacity', ledLevel.toFixed(3));

            renderTimes();
            slowTimer += dt;
            if (slowTimer > 0.25) {
                slowTimer = 0;
                renderGate();
            }
            saveTimer += dt;
            if (saveTimer > 1 && anyPlaying) {
                saveTimer = 0;
                savePositions();
            }
            requestAnimationFrame(frame);
        }

        // ---------------------------------------------------------------
        // Crossfader (position indicator; drag past centre to switch)
        // ---------------------------------------------------------------

        function initCrossfader() {
            const row = $('xfaderRow'), track = $('xfaderTrack'), knob = $('xfaderKnob'), xf = $('xfader');
            let dragging = false;
            const frac = (e) => {
                const r = track.getBoundingClientRect();
                return clamp((e.clientX - r.left) / r.width, 0, 1);
            };
            row.addEventListener('pointerdown', (e) => {
                if (!song) return;
                dragging = true;
                row.setPointerCapture(e.pointerId);
                xf.classList.add('dragging');
                knob.style.left = `${frac(e) * 100}%`;
            });
            row.addEventListener('pointermove', (e) => {
                if (dragging) knob.style.left = `${frac(e) * 100}%`;
            });
            const end = (e) => {
                if (!dragging) return;
                dragging = false;
                xf.classList.remove('dragging');
                const key = frac(e) < 0.5 ? 'A' : 'B';
                if (live !== key || !isPlaying(decks[key])) pressDeck(key);
                else updateUI();
            };
            row.addEventListener('pointerup', end);
            row.addEventListener('pointercancel', () => {
                dragging = false;
                xf.classList.remove('dragging');
                updateUI();
            });
        }

        // ---------------------------------------------------------------
        // Calibration mode (?calibrate): drag overlay anchors onto the render
        // ---------------------------------------------------------------

        function initCalibrate() {
            const box = document.createElement('div');
            box.className = 'cal';
            box.innerHTML = 'CALIBRATE · drag the copper handles onto the render, then paste into CONFIG.overlays<textarea readonly></textarea>';
            $('stage').appendChild(box);
            const out = box.querySelector('textarea');
            const hardware = $('hardware');
            hardware.style.pointerEvents = 'auto';

            const draw = () => {
                const o = CONFIG.overlays;
                const pts = { recA: o.recA, recB: o.recB, meterL: o.meterL, meterR: o.meterR, led: o.led };
                $('calHandles').innerHTML = Object.entries(pts).map(([k, p]) =>
                    `<g data-k="${k}" style="cursor:move"><circle cx="${p.x}" cy="${p.y}" r="7" fill="rgba(184,115,51,.45)" stroke="#d4a574" stroke-width="1.5"/><text x="${p.x + 9}" y="${p.y - 8}" font-size="9" fill="#fff" font-family="monospace">${k}</text></g>`
                ).join('');
                out.value = JSON.stringify(o, null, 1);
            };

            let dragKey = null;
            hardware.addEventListener('pointerdown', (e) => {
                const g = e.target.closest('[data-k]');
                if (!g) return;
                dragKey = g.dataset.k;
                hardware.setPointerCapture(e.pointerId);
            });
            hardware.addEventListener('pointermove', (e) => {
                if (!dragKey) return;
                const r = $('stage').getBoundingClientRect();
                const x = Math.round((e.clientX - r.left - cam.tx) / cam.S);
                const y = Math.round((e.clientY - r.top - cam.ty) / cam.S);
                const p = CONFIG.overlays[dragKey];
                if (p.face) {
                    p.face = [p.face[0] + x - p.x, p.face[1] + y - p.y, p.face[2], p.face[3]];
                }
                p.x = x;
                p.y = y;
                buildHardware();
                draw();
            });
            hardware.addEventListener('pointerup', () => { dragKey = null; });
            draw();
        }

        // ---------------------------------------------------------------
        // Wiring
        // ---------------------------------------------------------------

        async function init() {
            buildBackdrop();
            buildHardware();
            applyCamera(false);
            initCrossfader();
            updateUI();
            requestAnimationFrame(frame);

            const enter = document.querySelector('#welcomeForm .cta');
            enter.disabled = true;
            await loadCatalog();
            enter.disabled = false;
            updateUI();

            $('listenerName').value = store.name || '';
            $('welcomeForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = $('listenerName').value.trim();
                if (!name) return;
                store.name = name;
                saveStore();
                audioCtx();
                $('welcome').classList.remove('open');
                const ci = COLLECTIONS.findIndex((c) => votedCount(c) < c.songs.length);
                selectCollection(ci === -1 ? 0 : ci);
                flushOutbox();
            });

            $('barA').addEventListener('click', () => pressDeck('A'));
            $('barB').addEventListener('click', () => pressDeck('B'));
            $('barSelect').addEventListener('click', openVote);

            $('collections').addEventListener('click', (e) => {
                const b = e.target.closest('[data-c]');
                if (b && song && COLLECTIONS[b.dataset.c] !== collection) selectCollection(Number(b.dataset.c));
            });

            $('lyricsToggle').addEventListener('click', () => {
                const open = $('lyricsPanel').classList.toggle('expanded');
                $('lyricsToggle').setAttribute('aria-expanded', String(open));
                if (open) closeMenus();
            });
            $('pickerToggle').addEventListener('click', () => {
                const open = $('pickerPanel').classList.toggle('open');
                $('pickerToggle').setAttribute('aria-expanded', String(open));
                if (open) {
                    $('lyricsPanel').classList.remove('expanded');
                    $('lyricsToggle').setAttribute('aria-expanded', 'false');
                }
            });
            $('pickerList').addEventListener('click', (e) => {
                const b = e.target.closest('[data-s]');
                if (b) selectSong(Number(b.dataset.s));
            });
            $('prevSong').addEventListener('click', () => song && selectSong(songIdx - 1));
            $('nextSong').addEventListener('click', () => song && selectSong(songIdx + 1));
            document.addEventListener('pointerdown', (e) => {
                if (!e.target.closest('#pickerPanel')) closeMenus();
            });

            document.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
                pendingChoice = b.dataset.choice;
                renderChoice();
            }));
            $('voteForm').addEventListener('submit', submitVote);
            $('voteCancel').addEventListener('click', closeVote);

            $('doneNext').addEventListener('click', () => {
                $('done').classList.remove('open');
                selectCollection(Number($('doneNext').dataset.c));
            });
            $('doneStay').addEventListener('click', () => $('done').classList.remove('open'));

            document.addEventListener('keydown', (e) => {
                if (e.target.closest('input, textarea')) return;
                if (e.key === 'Escape') {
                    closeVote();
                    closeMenus();
                    $('lyricsPanel').classList.remove('expanded');
                    $('lyricsToggle').setAttribute('aria-expanded', 'false');
                    return;
                }
                if ($('welcome').classList.contains('open') || $('vote').classList.contains('open') || e.metaKey || e.ctrlKey) return;
                const key = e.key.toLowerCase();
                if (key === 'a') pressDeck('A');
                else if (key === 'b') pressDeck('B');
                else if (key === 's') openVote();
                else if (key === ' ' && live && !e.target.closest('button')) {
                    e.preventDefault();
                    pressDeck(live);
                }
            });

            window.addEventListener('resize', () => applyCamera(false));
            window.addEventListener('pagehide', savePositions);

            if (new URLSearchParams(location.search).has('calibrate')) initCalibrate();
        }

        init();
    </script>
</body>
